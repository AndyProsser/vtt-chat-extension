name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: dist-firefox
        path: build/firefox/
    - uses: actions/upload-artifact@v4
      with:
        name: dist-chrome
        path: build/chrome/
    - uses: actions/upload-artifact@v4
      with:
        name: dist-edge
        path: build/edge/

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm ci
    - run: npm run package
    - name: Upload release assets
      run: |
        gh release upload ${{ github.event.release.tag_name }} \
          build/vtt-chat-ddb-connector-firefox.zip \
          build/vtt-chat-ddb-connector-chrome.zip \
          build/vtt-chat-ddb-connector-edge.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
