
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VTT‑Chat Connector</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        margin: 10px;
        min-width: 260px;
      }
      .section { margin-bottom: 12px; }
      .server { display: flex; align-items: center; margin-bottom: 4px; }
      .server input[type="radio"] { margin-right: 6px; }
      button {
        background: #c53131;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary { background: #444; }
    </style>
  </head>
  <body>
    <div class="section">
      <strong>Servers</strong>
      <div id="servers"></div>
      <button id="add-server">Add Server</button>
    </div>

    <div class="section">
      <button id="relaunch" class="secondary">Reopen Last Session</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
