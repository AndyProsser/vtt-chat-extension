<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VTT‑Chat Connector</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        margin: 0;
        min-width: 320px;
        max-width: 420px;
        background: #1a1a2e;
        color: #e0e0e0;
      }

      /* ── header ── */
      .header {
        background: #c53131;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-title { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: 0.5px; }
      .header-logo  { width: 20px; height: 20px; flex-shrink: 0; }

      /* ── body ── */
      .body { padding: 12px 14px; }

      /* ── user bar ── */
      .user-bar {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px; background: #16213e; border-radius: 6px;
        margin-bottom: 0; cursor: pointer; user-select: none;
        transition: background 0.12s;
      }
      .user-bar:hover { background: #1c2a52; }
      .user-bar.no-user { cursor: default; }
      .user-bar.no-user:hover { background: #16213e; }

      .user-avatar-img  {
        width: 32px; height: 32px; border-radius: 50%;
        object-fit: cover; flex-shrink: 0; display: none;
      }
      .user-avatar-init {
        width: 32px; height: 32px; border-radius: 50%;
        background: #444; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        color: #888; font-size: 16px; font-weight: 700;
      }
      .user-info { flex: 1; min-width: 0; }
      .user-name { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .user-sub  { color: #888; font-size: 11px; margin-top: 1px; }
      .user-chevron { color: #555; font-size: 10px; flex-shrink: 0; transition: transform 0.15s; display: none; }
      .user-chevron.open { transform: rotate(180deg); }

      /* ── email section (slides below user bar) ── */
      .email-section {
        background: #0d1220; border: 1px solid #2a2a4a;
        border-top: none; border-radius: 0 0 6px 6px;
        padding: 8px 10px; margin-bottom: 10px;
      }
      .email-hint { font-size: 10px; color: #555; margin-top: 3px; }

      /* ── inputs ── */
      label { display: block; color: #aaa; font-size: 11px; margin-bottom: 2px; }
      input[type="url"],
      input[type="email"],
      input[type="password"] {
        width: 100%; padding: 7px 9px;
        border: 1px solid #333; border-radius: 4px;
        background: #0d1220; color: #e0e0e0;
        font-size: 13px; outline: none; display: block;
      }
      input:focus { border-color: #c53131; }

      /* ── section label ── */
      .section-label {
        font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.8px;
        color: #666; margin-bottom: 6px;
      }

      /* ── character list ── */
      #character-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }

      /* ── character card ── */
      .char-card {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 10px; background: #16213e; border-radius: 6px;
        cursor: pointer; border: 1px solid transparent;
        transition: background 0.12s, border-color 0.12s;
      }
      .char-card:hover   { background: #1c2a52; border-color: #2a3a5a; }
      .char-card.selected { border-color: #c53131; background: #1e1422; border-radius: 6px 6px 0 0; }
      .char-card.launching { opacity: 0.65; cursor: wait; pointer-events: none; }

      .char-avatar {
        width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 16px; color: #fff; overflow: hidden;
      }
      .char-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .char-info { flex: 1; min-width: 0; }
      .char-name     { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .char-detail   { font-size: 11px; color: #888; margin-top: 1px; }
      .char-campaign { font-size: 10px; color: #5a9abf; margin-top: 2px; }

      .char-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
      .char-edit-btn {
        background: none; border: none; padding: 2px 4px; cursor: pointer;
        font-size: 13px; color: #444; border-radius: 3px;
        opacity: 0; transition: opacity 0.12s, color 0.12s;
      }
      .char-card:hover .char-edit-btn { opacity: 1; }
      .char-edit-btn:hover { color: #aaa !important; }

      /* ── status dots ── */
      .status-dot {
        width: 8px; height: 8px; border-radius: 50%; cursor: help; flex-shrink: 0;
      }
      .status-dot.none    { background: #3a3a4a; }
      .status-dot.saved   { background: #c5a231; }
      .status-dot.active  { background: #2d8a5e; }
      .status-dot.offline { background: #7a2d2d; }
      .status-dot.checking {
        background: #c5a231;
        animation: dpulse 1s ease-in-out infinite;
      }
      @keyframes dpulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

      /* ── expand form (join / password) ── */
      .char-expand-form {
        background: #0d1220;
        border: 1px solid #c53131; border-top: none;
        border-radius: 0 0 6px 6px;
        padding: 10px 10px 12px;
        margin-bottom: 2px;
        display: none;
      }
      .char-expand-form.open { display: block; }

      .url-preview {
        margin-top: 4px; padding: 4px 8px; border-radius: 4px;
        font-size: 11px; border: 1px solid transparent; display: none;
      }
      .url-preview.ok    { display: block; background: #0d2e14; border-color: #2d6e35; color: #6fbf7a; }
      .url-preview.error { display: block; background: #2e0d0d; border-color: #6e2d2d; color: #bf6f6f; }

      /* ── buttons ── */
      button {
        border: none; border-radius: 4px; padding: 7px 12px;
        cursor: pointer; font-weight: 600; font-size: 12px;
        transition: opacity 0.12s;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-primary   { background: #c53131; color: #fff; width: 100%; font-size: 13px; padding: 8px 12px; }
      .btn-secondary { background: #2a2a4a; color: #ccc; width: 100%; }
      .mt6 { margin-top: 6px; }
      .mt8 { margin-top: 8px; }

      /* ── status box ── */
      .status-box {
        padding: 7px 10px; border-radius: 4px; font-size: 12px; line-height: 1.4;
        background: #16213e; color: #aaa; border: 1px solid #333;
        margin-bottom: 8px;
      }
      .status-box.ok    { border-color: #2d6e35; background: #0d2e14; color: #6fbf7a; }
      .status-box.error { border-color: #6e2d2d; background: #2e0d0d; color: #bf6f6f; }
      .status-box.info  { border-color: #2d4e6e; background: #0d1e2e; color: #6fa3bf; }

      /* ── divider ── */
      .divider { border: none; border-top: 1px solid #2a2a3a; margin: 8px 0; }

      /* ── campaign connections (collapsible) ── */
      details { margin-top: 2px; }
      summary {
        font-size: 11px; color: #555; cursor: pointer;
        list-style: none; padding: 4px 0; user-select: none;
      }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "▶ "; font-size: 9px; }
      details[open] summary::before { content: "▼ "; }

      .conn-list { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
      .conn-row {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 8px; background: #16213e; border-radius: 4px; font-size: 11px;
      }
      .conn-row-info  { flex: 1; min-width: 0; }
      .conn-row-name  { font-weight: 600; color: #ddd; }
      .conn-row-url   { color: #555; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .conn-del {
        color: #6e2d2d; cursor: pointer; font-size: 13px;
        padding: 2px 4px; border: none; background: none; border-radius: 3px;
        transition: color 0.12s;
      }
      .conn-del:hover { color: #cf4a4a; }

      /* ── DM campaign cards ── */
      #dm-campaign-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
      .dm-badge {
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
      }
      .char-card.dm-locked { opacity: 0.45; cursor: default; pointer-events: none; }
      .char-card.dm-locked:hover { background: #16213e; border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="header-logo" src="../icons/icon-32.png" alt="VTT-Chat logo">
      <span class="header-title">VTT‑Chat Connector</span>
    </div>

    <div class="body">

      <!-- User identity bar -->
      <div class="user-bar no-user" id="user-bar" title="Click to edit email">
        <div class="user-avatar-init" id="user-avatar-init">?</div>
        <img class="user-avatar-img" id="user-avatar-img" src="" alt="" />
        <div class="user-info">
          <div class="user-name" id="user-name">Not signed in to D&amp;D Beyond</div>
          <div class="user-sub"  id="user-sub">Open a D&amp;D Beyond page first</div>
        </div>
        <span class="user-chevron" id="user-chevron">▼</span>
      </div>

      <!-- Collapsible email section -->
      <div class="email-section" id="email-section" style="display:none">
        <label>
          Email
          <input id="user-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </label>
        <div class="email-hint">Used for account matching on the VTT-Chat server.</div>
      </div>

      <!-- Character list -->
      <div class="section-label" style="margin-top:12px;">Characters</div>
      <div id="character-list"></div>

      <!-- DM Campaigns (shown only when user owns campaigns) -->
      <div id="dm-section" style="display:none">
        <div class="section-label" style="margin-top:10px;">Your Campaigns (DM)</div>
        <div id="dm-campaign-list"></div>
      </div>

      <!-- Status message -->
      <div id="status" class="status-box" style="display:none;"></div>

      <hr class="divider" />

      <!-- Reopen last session -->
      <button class="btn-secondary" id="relaunch" disabled style="margin-bottom:8px;">
        Reopen Last Session
      </button>

      <!-- Campaign Connections -->
      <details id="connections-details">
        <summary>Campaign Connections</summary>
        <div class="conn-list" id="conn-list"></div>
      </details>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
